# IPEDS 다운로더 설정 파일
# 이 파일은 IPEDS 데이터 다운로더의 기본 설정을 정의합니다.

# IPEDS 데이터 센터 설정
ipeds:
  # 기본 URL
  base_url: "https://nces.ed.gov/ipeds/datacenter/data/"

  # User-Agent 설정 (예의바른 크롤링)
  user_agent: "IPEDS-Downloader/1.0 (Educational Research Purpose; Contact: research@example.com)"

  # 다운로드할 연도 범위
  years:
    # 시작 연도 (null이면 가능한 가장 이른 연도부터)
    start: 2013
    # 종료 연도 (null이면 최신 연도까지 자동 감지)
    end: null

  # 다운로드할 서베이 목록 (null이면 모든 서베이)
  # 특정 서베이만 다운로드하려면 리스트로 지정
  surveys: null
  # surveys:
  #   - HD
  #   - IC
  #   - EF
  #   - F

# 파일 저장 설정
storage:
  # 원본 데이터 저장 경로
  raw_dir: "./data/raw"

  # 압축 해제된 데이터 저장 경로
  extracted_dir: "./data/extracted"

  # 메타데이터 저장 경로
  metadata_dir: "./data/metadata"

  # 로그 파일 저장 경로
  log_dir: "./logs"

  # 파일 레지스트리 이름
  file_registry: "file_registry.json"

  # 다운로드 로그 이름
  download_log: "download_log.json"

# 다운로드 동작 설정
download:
  # 이미 존재하는 파일 건너뛰기
  skip_existing: true

  # 파일 무결성 검증 활성화
  verify_checksum: true

  # 다운로드 후 자동 압축 해제
  auto_extract: false

  # 최대 동시 다운로드 수 (1 = 순차 다운로드)
  max_concurrent: 1

  # 요청 간 대기 시간 (초)
  request_delay: 1.0

# 재시도 설정
retry:
  # 최대 재시도 횟수
  max_attempts: 3

  # 재시도 간격 (초) - 지수 백오프
  backoff_factor: 2.0

  # 초기 재시도 간격 (초)
  initial_delay: 2.0

  # 최대 재시도 간격 (초)
  max_delay: 60.0

  # 404 에러 시 재시도 하지 않음
  retry_on_404: false

# 타임아웃 설정 (초)
timeout:
  # 연결 타임아웃
  connect: 10

  # 읽기 타임아웃 (큰 파일을 고려하여 충분히 설정)
  read: 300

# 로깅 설정
logging:
  # 로그 레벨 (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"

  # 콘솔 출력 활성화
  console: true

  # 파일 출력 활성화
  file: true

  # 로그 파일 형식
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # 날짜 형식
  date_format: "%Y-%m-%d %H:%M:%S"

# 진행 상황 표시 설정
progress:
  # 진행률 바 표시
  show_progress: true

  # 다운로드 속도 표시
  show_speed: true

  # 예상 남은 시간 표시
  show_eta: true
